<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>マルのちずマスター – Maru's Map Mastery</title>
  <meta name="description" content="Practice the Japanese names of Japan's regions, prefectures, cities and landmarks with Maru.">
  <link rel="icon" type="image/svg+xml" href="assets/maru-happy.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="show-kana show-en">
  <header class="topbar">
    <button class="brand" id="brand" aria-label="メニュー / Menu">
      <img src="assets/maru-happy.svg" alt="" width="36" height="36">
      <span class="brand-text">
        <span class="ja">マルのちずマスター</span>
        <span class="en">Maru's Map Mastery</span>
      </span>
    </button>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="optKana" checked>
        <span><span class="ja">ふりがな</span><span class="en">Readings</span></span></label>
      <label class="toggle"><input type="checkbox" id="optEn" checked>
        <span><span class="ja">えいご</span><span class="en">English</span></span></label>
    </div>
  </header>

  <main id="app">
    <!-- MENU -->
    <section id="screen-menu" class="screen">
      <div class="hero">
        <img src="assets/maru-happy.svg" alt="Maru" class="hero-maru">
        <div class="hero-text">
          <h1><span class="ja">いっしょににほんをおぼえよう！</span>
              <span class="en">Let's learn Japan together!</span></h1>
          <p><span class="ja">ぼくは「マル」。ちずのクイズをだすよ。</span>
             <span class="en">I'm Maru. I'll quiz you on the map.</span></p>
        </div>
      </div>

      <h2 class="section-title"><span class="ja">なにをれんしゅうする？</span><span class="en">What do you want to practise?</span></h2>
      <div class="cards" id="modeCards"></div>

      <h2 class="section-title"><span class="ja">もんだいのかたち</span><span class="en">Question style</span></h2>
      <div class="seg" id="dirSeg" role="radiogroup"></div>

      <div class="menu-actions">
        <button class="btn ghost" id="btnStudy"><span class="ja">🗾 がくしゅうモード</span><span class="en">Study mode – explore the map</span></button>
        <button class="btn ghost small" id="btnReset"><span class="ja">きろくをけす</span><span class="en">Reset progress</span></button>
      </div>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen hidden">
      <div class="game-layout">
        <div class="map-wrap" id="mapWrapGame"></div>
        <aside class="panel">
          <div class="hud">
            <div class="hud-item"><span class="ja">もんだい</span><span class="en">Question</span><b id="hudQ">1/10</b></div>
            <div class="hud-item"><span class="ja">スコア</span><span class="en">Score</span><b id="hudScore">0</b></div>
            <div class="hud-item"><span class="ja">れんぞく</span><span class="en">Streak</span><b id="hudStreak">0</b></div>
            <button class="btn tiny ghost" id="btnQuit"><span class="ja">やめる</span><span class="en">Quit</span></button>
          </div>
          <div class="progress"><div id="progressBar"></div></div>

          <div class="maru-row">
            <img id="maruImg" src="assets/maru-happy.svg" alt="Maru" class="maru">
            <div class="bubble" id="bubble"></div>
          </div>

          <div id="choices" class="choices"></div>
          <div id="feedback" class="feedback hidden" aria-live="polite"></div>
          <button class="btn primary next hidden" id="btnNext"><span class="ja">つぎへ ▶</span><span class="en">Next</span></button>
        </aside>
      </div>
    </section>

    <!-- RESULT -->
    <section id="screen-result" class="screen hidden">
      <div class="result">
        <img id="resultMaru" src="assets/maru-happy.svg" alt="Maru" class="result-maru">
        <h2 id="resultTitle"></h2>
        <div class="result-score"><b id="resultScore">0</b><span id="resultOf"></span></div>
        <div id="resultStats" class="result-stats"></div>
        <div id="resultMissed"></div>
        <div class="menu-actions">
          <button class="btn primary" id="btnAgain"><span class="ja">もういちど</span><span class="en">Play again</span></button>
          <button class="btn" id="btnWeak"><span class="ja">にがてをれんしゅう</span><span class="en">Practise weak spots</span></button>
          <button class="btn ghost" id="btnMenu"><span class="ja">メニューへ</span><span class="en">Back to menu</span></button>
        </div>
      </div>
    </section>

    <!-- STUDY -->
    <section id="screen-study" class="screen hidden">
      <div class="game-layout">
        <div class="map-wrap" id="mapWrapStudy"></div>
        <aside class="panel">
          <h2 class="section-title tight"><span class="ja">がくしゅうモード</span><span class="en">Study mode</span></h2>
          <p class="hint"><span class="ja">ちずをタップ・ズームして、なまえをかくにんしよう。</span><span class="en">Tap and zoom the map to check the names.</span></p>
          <div class="chips" id="layerChips"></div>
          <div id="studyInfo" class="study-info"></div>
        </aside>
      </div>
    </section>
  </main>

  <script src="js/mapdata.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mapview.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
