  <path d="M112 100 Q124 84 136 100" fill="none" stroke="#3b2a20" stroke-width="5" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="62" cy="116" rx="12" ry="8" fill="#ff8f8f" opacity=".7"/>
  <ellipse cx="138" cy="116" rx="12" ry="8" fill="#ff8f8f" opacity=".7"/>
