<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Maru (happy)">
  <ellipse cx="100" cy="186" rx="52" ry="8" fill="#000" opacity=".12"/>
  <!-- feet -->
  <ellipse cx="72" cy="176" rx="17" ry="9" fill="#f3e6d3" stroke="#3b2a20" stroke-width="3"/>
  <ellipse cx="128" cy="176" rx="17" ry="9" fill="#f3e6d3" stroke="#3b2a20" stroke-width="3"/>
  <!-- raised arms -->
  <path d="M34 112 Q14 92 22 66" fill="none" stroke="#3b2a20" stroke-width="3" stroke-linecap="round"/>
  <circle cx="22" cy="64" r="9" fill="#fffaf0" stroke="#3b2a20" stroke-width="3"/>
  <path d="M166 112 Q186 92 178 66" fill="none" stroke="#3b2a20" stroke-width="3" stroke-linecap="round"/>
  <circle cx="178" cy="64" r="9" fill="#fffaf0" stroke="#3b2a20" stroke-width="3"/>
  <!-- body -->
  <circle cx="100" cy="106" r="68" fill="#fffaf0" stroke="#3b2a20" stroke-width="4"/>
  <path d="M52 140 Q100 176 148 140" fill="none" stroke="#f0dcc0" stroke-width="10" stroke-linecap="round" opacity=".7"/>
  <!-- red maru on forehead -->
  <circle cx="100" cy="58" r="12" fill="#e03a3e" stroke="#3b2a20" stroke-width="3"/>
  <circle cx="96" cy="54" r="3.5" fill="#fff" opacity=".7"/>
  <!-- eyes ^ ^ -->
