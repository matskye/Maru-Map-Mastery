  <path d="M90 128 Q100 136 110 128 Q100 122 90 128Z" fill="#ff7b86"/>
  <!-- sparkles -->
  <g fill="#ffc933" stroke="#e0a100" stroke-width="1.5" stroke-linejoin="round">
